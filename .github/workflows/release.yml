name: Release & Publish (Gradle)

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:

  # =========================
  # BUILD
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: 🔐 Configure Gradle credentials for GitHub Packages
        run: |
          mkdir -p ~/.gradle
          cat <<EOF > ~/.gradle/gradle.properties
          gpr.user=${GITHUB_ACTOR}
          gpr.key=${GITHUB_TOKEN}
          EOF
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.OMNIXYS_TOKEN }}

      - name: Build & Test
        run: ./gradlew test


  # =========================
  # RELEASE (semantic-release)
  # =========================
  release:
    runs-on: ubuntu-latest
    needs: build

    outputs:
      released: ${{ steps.semantic.outputs.released }}
      version: ${{ steps.semantic.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 🔥 REQUIRED for tags + history

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      - name: Install semantic-release
        run: |
          npm install -g semantic-release \
            @semantic-release/changelog \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/exec \
            conventional-changelog-conventionalcommits@^9

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npx semantic-release | tee log.txt

          if grep -q "Published release" log.txt; then
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT


  # =========================
  # PUBLISH (Gradle)
  # =========================
  publish:
    runs-on: ubuntu-latest
    needs: release

    if: needs.release.outputs.released == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # 🔥 ensure we are on latest main INCLUDING release commit
      - name: Ensure latest main
        run: |
          git fetch origin main
          git checkout origin/main

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26

      # 🔥 SINGLE SOURCE OF TRUTH = gradle.properties
      - name: Extract version from gradle.properties
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "📦 Publishing version: $VERSION"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: 🔐 Configure Gradle credentials for GitHub Packages
        run: |
          mkdir -p ~/.gradle
          cat <<EOF > ~/.gradle/gradle.properties
          gpr.user=${GITHUB_ACTOR}
          gpr.key=${GITHUB_TOKEN}
          EOF
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.OMNIXYS_TOKEN }}

      # 🔐 Publish to GitHub Packages / Maven
      - name: Publish
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}